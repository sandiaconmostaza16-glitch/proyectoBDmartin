# SQL Server 2022 para desarrollo. Uso: docker compose up -d
# La contrasena debe coincidir con DB_PASSWORD en backend/.env
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ruta-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ruta_Dev_2026!"
    ports:
      - "1433:1433"
    volumes:
      - ruta-sql-data:/var/opt/mssql

volumes:
  ruta-sql-data:
